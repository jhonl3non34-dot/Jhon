# Deploy no Render (https://render.com): crie um "Blueprint" apontando para este repositório.
services:
  - type: web
    name: proposito-em-deus
    runtime: docker
    plan: starter            # plano pago: necessário para o disco persistente
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: PUBLIC_URL
        sync: false           # ex.: https://proposito.seudominio.com.br
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: dados
      mountPath: /app/data
      sizeGB: 1
